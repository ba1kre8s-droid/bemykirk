<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#050505" />
  <title>Will You Be My Kirk?</title>
  <link rel="stylesheet" href="styles.css?v=20260904-1" />
</head>
<body>
  <main id="proposal" class="proposal" aria-live="polite">
    <section class="card" aria-label="Kirkiversary proposal">
      <img
        id="kirkImage"
        class="hero-image"
        src="assets/kirk.jpg?v=20260904-1"
        alt="Will you be my Kirk?"
        draggable="false"
      />

      <div class="actions" id="actions">
        <button id="yesBtn" class="choice yes" type="button" aria-label="Yes">YES</button>
        <button id="noBtn" class="choice no" type="button" aria-label="No">NO</button>
      </div>
    </section>
  </main>

  <div id="flashOverlay" class="flash-overlay" aria-hidden="true">
    <img src="assets/no-reaction.jpg?v=20260904-1" alt="" draggable="false" />
  </div>

  <section id="yesScreen" class="yes-screen" aria-hidden="true">
    <img src="assets/yes-reveal.jpg?v=20260904-1" alt="Yes" draggable="false" />
  </section>

  <audio id="boomAudio" preload="auto" src="assets/vine-boom.mp3?v=20260904-1"></audio>
  <audio id="yesMusic" preload="auto" loop src="assets/noname.mp3?v=20260904-1"></audio>

  <script src="script.js?v=20260904-1" defer></script>
</body>
</html>
