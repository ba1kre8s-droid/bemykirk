<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Will You Be My Kirk?</title>

  <link rel="preload" as="image" href="kirk.jpg" />
  <link rel="preload" as="image" href="reaction.jpg" />
  <link rel="preload" as="image" href="yes-reveal.jpg" />
  <link rel="preload" as="audio" href="music.mp3" />
  <link rel="preload" as="audio" href="vine-boom.mp3" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app" id="app">
    <section class="stage" id="stage" aria-label="Will you be my Kirk?">
      <img class="hero" src="kirk.jpg" alt="Will you be my Kirk?" draggable="false" />

      <div class="controls" id="controls">
        <button class="choice choice-yes is-locked" id="yesBtn" type="button" aria-disabled="true">
          YES
        </button>

        <button class="choice choice-no" id="noBtn" type="button">
          NO
        </button>
      </div>

      <div class="hint" id="hint">Try the buttons 👀</div>

      <div class="reaction-flash" id="reactionFlash" aria-hidden="true">
        <img src="reaction.jpg" alt="" draggable="false" />
      </div>
    </section>

    <section class="reveal" id="reveal" aria-hidden="true">
      <img src="yes-reveal.jpg" alt="Yes reveal meme" draggable="false" />
    </section>

    <audio id="music" src="music.mp3" preload="auto" loop></audio>
    <audio id="boom" src="vine-boom.mp3" preload="auto"></audio>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
